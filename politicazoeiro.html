
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colégio Estadual Mendes Gonçalves</title>
    <link rel="icon" type="image/x-icon" href="img/logomendes.png">

    <style>
        body {
            background-color: #1a1a1a; /* Fundo escuro depressivo */
            color: #ff3333; /* Vermelho erro crítico */
            font-family: "Comic Sans MS", "Chalkboard SE", sans-serif; /* A fonte mais temida do design */
            text-align: center;
            padding-top: 15%;
            overflow: hidden; /* Evita barras de rolagem com a tremedeira */
        }

        h1 {
            font-size: 2.5rem;
            text-transform: uppercase;
            text-shadow: 2px 2px 0px #000;
            animation: tremer 0.1s infinite; /* O texto treme de desespero */
        }

        a {
            display: inline-block;
            margin-top: 30px;
            padding: 10px 20px;
            background-color: #ffcc00; /* Amarelo gambiarra */
            color: #000;
            text-decoration: none;
            font-weight: bold;
            border: 3px dashed #000;
            transform: rotate(-5deg); /* Botão torto feito nas coxas */
            transition: all 0.2s;
        }

        a:hover {
            background-color: #00ff00; /* Verde "agora vai" */
            transform: rotate(5deg) scale(1.2); /* Gira pro outro lado e aumenta */
            cursor: help; /* Cursor de interrogação porque ninguém sabe se o link funciona */
        }

        /* Animação pro texto ficar tremendo de nervoso */
        @keyframes tremer {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            100% { transform: translate(-1px, -1px) rotate(0.5deg); }
        }
    </style>
</head>
<body>
<h1>Devido a falta de orçamento infelizmente não temos as politicas de privacidade :(</h1>
<a href="index.html">VOLTAR</a>
</body>
